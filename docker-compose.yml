version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhu_jal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhu_jal_password}
      POSTGRES_DB: ${POSTGRES_DB:-bhu_jal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhu_jal_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bhu_jal_user}:${POSTGRES_PASSWORD:-bhu_jal_password}@db:5432/${POSTGRES_DB:-bhu_jal}
      - ENVIRONMENT=production
      - SCHEDULER_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/ml/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
